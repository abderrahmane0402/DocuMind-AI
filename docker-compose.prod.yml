services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: documind_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-documind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: documind_redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Qdrant Vector Engine
  qdrant:
    image: qdrant/qdrant:latest
    container_name: documind_qdrant
    restart: always
    volumes:
      - qdrantdata:/qdrant/storage

  # 4. FastAPI Backend API
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: documind_api
    restart: always
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-DocuMind AI}
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-documind}
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-documind_chunks}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 5. Celery Asynchronous Ingestion & OCR Worker
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: documind_worker
    restart: always
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-DocuMind AI}
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-documind}
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-documind_chunks}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2

  # 6. Production Frontend Web Server (Nginx)
  web:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: documind_web
    restart: always
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  uploads_data: