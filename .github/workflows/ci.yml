name: DocuMind AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install httpx

      - name: Run Backend Pytest
        env:
          PYTHONPATH: apps/backend
          SECRET_KEY: ci_secret_key_test_1234567890123456
          POSTGRES_PASSWORD: ci_test_password
          GROQ_API_KEY: gsk_ci_mock_key
        run: |
          pytest apps/backend/tests -v

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: apps/frontend
        run: npm run build